name: Package checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['**/*.md', 'QA Process Context/**/*.json', 'Application Flow Map/**/*.json', 'automation/**/*.ts', 'automation/**/*.json', '.github/workflows/**', '.gitignore', 'package.json', 'package-lock.json', 'tsconfig.json']
  pull_request:
    paths: ['**/*.md', 'QA Process Context/**/*.json', 'Application Flow Map/**/*.json', 'automation/**/*.ts', 'automation/**/*.json', '.github/workflows/**', '.gitignore', 'package.json', 'package-lock.json', 'tsconfig.json']
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --cache .local/npm-cache
      - run: npm run check
      - run: npm test
      - run: npm run test:postman
      - run: npm run qa -- github install --source package-ci-pinned-tool-verification
      - run: npm run qa -- browser install
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install-deps chromium
      - run: npm run test:browsers
      - run: npm run test:chrome
      - name: Headed Chrome fixtures (Windows)
        if: runner.os == 'Windows'
        run: npm run test:chrome
        env:
          QA_CHROME_HEADED: '1'
      - name: Headed Chrome fixtures (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:chrome
        env:
          QA_CHROME_HEADED: '1'
