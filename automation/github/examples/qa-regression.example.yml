# Inactive adoption template: supply reviewed project files and enable deliberately.
name: Reviewed project regression
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: reviewed-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  regression:
    if: vars.QA_AUTOMATION_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Execute trusted QA code, not a PR-supplied workflow or package script.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --cache .local/npm-cache
      - name: Load actual approved bot/repository settings
        env:
          QA_GITHUB_SETTINGS: ${{ vars.QA_GITHUB_SETTINGS }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(process.env.QA_GITHUB_SETTINGS); fs.mkdirSync('.local',{recursive:true}); fs.writeFileSync('.local/github-settings.json',JSON.stringify(v));"
      # This adapter must observe the preview actually deployed for the event head.
      # It writes .local/observed-target.json plus its hashed observation source.
      # It is project-owned; this package cannot invent a universal build endpoint.
      - run: node qa-project/observe-preview-identity.mjs
        env:
          QA_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Run only under an actual matching policy
        env:
          GH_TOKEN: ${{ github.token }}
          QA_REPOSITORY: ${{ github.repository }}
          QA_PR: ${{ github.event.pull_request.number }}
          QA_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          QA_RUN_SOURCE: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          npm run qa -- github run
          --repository "$QA_REPOSITORY" --number "$QA_PR"
          --policy qa-project/reviewed-regression-policy.json
          --target .local/observed-target.json --source "$QA_RUN_SOURCE"
      # Retain only reviewed redacted suite artifacts; never upload .local wholesale.
      # The agent reviews actual results and completes findings/sign-off separately.
